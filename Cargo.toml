[package]
name = "remote-au"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "LAN N→1 audio daemon (macOS receiver / Windows sender)"
rust-version = "1.85"

[[bin]]
name = "remote-au"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake2 = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"

[target.'cfg(windows)'.dependencies]
wasapi = "0.19"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
