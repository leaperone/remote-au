name: release

# Cut a release by pushing a semver tag that matches Cargo.toml, e.g.:
#   git tag v0.4.0 && git push origin v0.4.0
#
# Builds native Rust binaries (macOS Apple Silicon + Windows x64), runs locked
# tests and Python proxy unit tests, publishes versioned archives and
# SHA256SUMS.txt to a draft GitHub Release. Does not publish npm (legacy Go).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            package: macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: windows-x64
            archive_ext: zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "$CARGO" ]; then
            echo "Tag version ($TAG) does not match Cargo.toml ($CARGO)"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Test (locked)
        run: cargo test --locked

      - name: Verify impairment proxy routing
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release tree
        shell: bash
        run: |
          python scripts/package-release.py \
            --target "${{ matrix.target }}" \
            --package "${{ matrix.package }}" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA"

      - name: Create versioned archive (macOS)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          set -euo pipefail
          base="remote-au-${{ matrix.package }}-${VERSION}"
          tar -czf "artifact/${base}.tar.gz" -C artifact "remote-au-${{ matrix.package }}"
          ls -la artifact/

      - name: Create versioned archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $base = "remote-au-${{ matrix.package }}-${env:VERSION}"
          Compress-Archive -Path "artifact/remote-au-${{ matrix.package }}" -DestinationPath "artifact/$base.zip" -Force
          Get-ChildItem artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.package }}
          path: |
            artifact/remote-au-${{ matrix.package }}-*
          if-no-files-found: error

  publish:
    name: draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*
          path: release
          merge-multiple: true

      - name: Aggregate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release
          ls -la
          : > SHA256SUMS.txt
          for f in remote-au-*; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Create draft release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/remote-au-macos-arm64-"${VERSION}".tar.gz \
            release/remote-au-windows-x64-"${VERSION}".zip \
            release/SHA256SUMS.txt
